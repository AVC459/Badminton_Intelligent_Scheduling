# ==================== Server ====================
server.port=8083
server.address=0.0.0.0
# ==================== Spring ====================
spring.application.name=badminton
# ==================== Database ====================
spring.datasource.url=jdbc:mysql://localhost:3306/badminton?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# 本地开发默认值，开箱可跑；部署时用环境变量 MYSQL_USERNAME / MYSQL_PASSWORD 覆盖
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ==================== MyBatis-Plus ====================
mybatis-plus.type-aliases-package=com.ape.badminton.entity
mybatis-plus.global-config.db-config.id-type=assign_uuid
mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.global-config.db-config.table-prefix=sys_,biz_
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ==================== 本地 Ollama（名单智能识别） ====================
# 模型只负责「判断每一列是什么字段」（列映射），不逐行转写：
# 输出只有几十个 token，所以超时按秒计、样例行数几行就够。
# 注意不要把 max-rows 当成「识别行数」调大 —— 它与识别耗时无关，
# 调大只会拉长提示词、反而更慢。
ollama.enabled=true
ollama.base-url=http://127.0.0.1:11434
ollama.model=qwen2.5:7b
ollama.timeout-seconds=60
ollama.max-rows=3
